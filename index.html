<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes"
    />

    <title>Đường dẫn bảo mật</title>

    <link rel="icon" type="image/x-icon" href="assets/favicon.svg" />
    <link rel="stylesheet" href="styles/style.css" type="text/css" />

    <script type="module" src="scripts/index.js"></script>
  </head>

  <body>
    <noscript>
      <p role="alert" aria-live="assertive">
        Trình duyệt của bạn không hỗ trợ JavaScript hoặc JavaScript đã bị vô
        hiệu hóa. Vui lòng bật JavaScript để sử dụng tính năng này.
      </p>
    </noscript>

    <header>
      <h1 class="visually-hidden">Đường dẫn bảo mật</h1>
    </header>

    <main>
      <section id="instructions">
        <h2>Nhập mật khẩu để mở khóa liên kết.</h2>
        <p class="visually-hidden">
          Mật khẩu được cung cấp bởi người tạo liên kết.
        </p>
      </section>

      <hr />

      <form id="password-form">
        <div class="field">
          <label for="password">MẬT KHẨU</label>
          <input type="password" id="password" autofocus />
        </div>
        <button type="submit" disabled>Mở khóa</button>
        <div
          id="loading-indicator"
          aria-live="polite"
          aria-atomic="true"
          style="display: none"
        >
          Đang chuyển hướng...
        </div>
      </form>
    </main>
  </body>
</html>
